# Afternoon half of the 0DTE gamma-exposure session poll.
#
# Also starts early — 16:10 UTC is 12:10 EDT — for the same reason as the morning half: a
# scheduled trigger that arrives 40 minutes late would cost the 12:45, 13:00 and 13:15 snapshots.
#
# Starting before the morning half has finished is intentional and safe. Both workflows share
# the `gex-archive` concurrency group with cancel-in-progress false, so this run simply queues
# and is released the instant the morning job exits at 12:35 ET — which puts it in place for the
# 12:45 snapshot with no gap and no overlap. A queued run burns no minutes while it waits.
name: GEX poll (afternoon)

on:
  schedule:
    - cron: '10 16 * * 1-5'
  workflow_dispatch:        # so a run can be triggered by hand to verify the setup

permissions:
  contents: write

concurrency:
  # One group per workflow, not one shared across all three. A shared group meant a late or
  # queued run of any workflow blocked the others, and GitHub keeps only one pending run per
  # group — so a newly triggered run silently cancels an older pending one. With redundant
  # triggers that hazard is unacceptable. Races on the append-only summary.csv are handled
  # where they belong: commit-archive.sh rebases and retries, and fetch_gex_poll.py refuses to
  # write a (date, time) it already holds.
  group: gex-afternoon
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Poll every 15 minutes until 16:10 ET
        run: python3 gex_session.py --until 16:10 --commit

      - name: Commit snapshots
        if: always()
        run: bash .github/commit-archive.sh 'gex afternoon session'
