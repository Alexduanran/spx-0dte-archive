# Morning half of the 0DTE gamma-exposure session poll.
#
# Starts deliberately early — 12:20 UTC is 08:20 EDT, over an hour before the first snapshot
# is due. That is not slack for its own sake. GitHub's scheduler fires late as a matter of
# course, and on 2026-08-19 a 13:20 UTC trigger did not start until 13:59, losing the 09:30 and
# 09:45 snapshots outright. The 0DTE gamma profile is at its most informative right at the open,
# while it is still spread across strikes rather than collapsed onto the at-the-money spike, so
# those are the worst two of the day to lose. Starting an hour early means even a 45-minute
# delay still lands before 09:25 ET.
#
# Idling costs nothing that matters: gex_session.py sleeps to the next quarter hour and
# fetch_gex_poll.py refuses anything before 09:25 ET, so an early start does no work. The same
# margin absorbs the EDT/EST shift — under EST this is 07:20 ET and simply idles longer.
name: GEX poll (morning)

on:
  schedule:
    - cron: '20 12 * * 1-5'
  workflow_dispatch:        # so a run can be triggered by hand to verify the setup

permissions:
  contents: write

concurrency:
  # One group per workflow, not one shared across all three. A shared group meant a late or
  # queued run of any workflow blocked the others, and GitHub keeps only one pending run per
  # group — so a newly triggered run silently cancels an older pending one. With redundant
  # triggers that hazard is unacceptable. Races on the append-only summary.csv are handled
  # where they belong: commit-archive.sh rebases and retries, and fetch_gex_poll.py refuses to
  # write a (date, time) it already holds.
  group: gex-morning
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Poll every 15 minutes until 12:35 ET
        run: python3 gex_session.py --until 12:35 --commit

      - name: Commit snapshots
        if: always()
        run: bash .github/commit-archive.sh 'gex morning session'
